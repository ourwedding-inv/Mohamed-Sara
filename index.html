<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mohamed & Sara — Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    
      background:
        linear-gradient(
          rgba(255, 248, 240, 0.45),
          rgba(255, 248, 240, 0.45)
        ),
        url("background.jpg");

      background-size: cover;
      background-position: center;
      font-family: 'Cinzel', serif;
      overflow: hidden;
      position: relative;
    }

    .fade-cover {
      position: fixed;
      inset: 0;
      background: #fbf3e4;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.9s ease;
    }

    .fade-cover.show {
      opacity: 1;
    }

    .hint {
      margin-top: 22px;
      color: #4b2d06;
      font-size: 18px;
      letter-spacing: 4px;
      /* opacity: 0.75; */
      font-weight: bolder;
      animation: pulseHint 2.4s ease-in-out infinite;
      z-index: 2;
      text-align: center;
      transition: opacity 0.4s ease;
    }

    @keyframes pulseHint {

      0%,
      100% {
        opacity: 0.45;
      }

      50% {
        opacity: 0.9;
      }
    }

    .stage {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 1123/1401;
      cursor: pointer;
      filter: drop-shadow(0 20px 35px rgba(90, 65, 30, 0.35));
      transition: transform 0.4s ease;
    }

    .stage:hover {
      transform: scale(1.015);
    }

    .stage.opening {
      animation: liftOpen 1.35s cubic-bezier(.55, .05, .25, 1) forwards;
      pointer-events: none;
    }

    @keyframes liftOpen {
      0% {
        transform: scale(1) translateY(0) rotate(0deg);
        filter: drop-shadow(0 20px 35px rgba(90, 65, 30, 0.35)) brightness(1);
      }

      35% {
        transform: scale(1.04) translateY(-4px) rotate(-0.3deg);
        filter: drop-shadow(0 26px 40px rgba(90, 65, 30, 0.4)) brightness(1.1);
      }

      100% {
        transform: scale(1.22) translateY(-40px) rotate(0.4deg);
        filter: drop-shadow(0 10px 20px rgba(90, 65, 30, 0)) brightness(1.5) blur(3px);
        opacity: 0;
      }
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      padding-top: 20%;
      border-radius: 4px;
      filter: contrast(1.06) saturate(1.05);
    }

    .seal-boost {
      position: absolute;
      left: 51%;
      top: 53.6%;
      width: 15.5%;
      height: 12%;
      transform: translate(-50%, -50%) rotate(-3deg);
      z-index: 2;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 40%),
        radial-gradient(circle at 72% 80%, rgba(70, 45, 15, 0.55) 0%, rgba(70, 45, 15, 0) 55%);
      mix-blend-mode: soft-light;
      box-shadow:
        inset 3px 5px 7px rgba(255, 252, 240, 0.55),
        inset -6px -8px 11px rgba(70, 45, 15, 0.55),
        0 4px 7px rgba(60, 38, 14, 0.35);
      transition: opacity 0.4s ease;
    }

    .glow {
      position: absolute;
      left: 50.3%;
      top: 53.5%;
      width: 26%;
      height: 22%;
      transform: translate(-50%, -50%);
      z-index: 3;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 244, 214, 0.55) 0%, rgba(255, 244, 214, 0) 70%);
      pointer-events: none;
      animation: breathe 2.6s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.92);
      }

      50% {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    .ripple {
      position: absolute;
      left: 50.3%;
      top: 53.6%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 250, 225, 0.95) 0%, rgba(255, 230, 170, 0.55) 40%, rgba(255, 230, 170, 0) 72%);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 4;
      pointer-events: none;
    }

    .stage.opening .ripple {
      animation: rippleBurst 1.2s ease-out forwards;
    }

    .stage.opening .glow,
    .stage.opening .seal-boost {
      opacity: 0;
    }

    @keyframes rippleBurst {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -50%) scale(36);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="fade-cover" id="fadeCover"></div>
  <div class="hint" id="hint">TAP TO OPEN</div>

  <div class="stage" id="stage">
    <img class="photo" src="envlope.png" <div class="seal-boost">
  </div>
  <div class="glow"></div>
  <div class="ripple"></div>
  </div>


  <script>
    const stage = document.getElementById('stage');
    const hint = document.getElementById('hint');
    const fadeCover = document.getElementById('fadeCover');
    let opened = false;

    stage.addEventListener('click', () => {
      if (opened) return;
      opened = true;

      stage.classList.add('opening');
      hint.style.opacity = '0';

      setTimeout(() => {
        fadeCover.classList.add('show');
      }, 700);

      setTimeout(() => {
        window.location.href = 'main.html';
      }, 1650);
    });
  </script>

</body>

</html>
